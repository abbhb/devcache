name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  native:
    uses: ./.github/workflows/build.yml
  publish:
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          path: artifacts
          merge-multiple: true
      - name: Assemble and verify release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/assemble_release.py "$RELEASE_TAG" artifacts release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/*.tar.gz release/install.sh release/SHA256SUMS --verify-tag --title "devcache $RELEASE_TAG" --notes-file release-notes.md
