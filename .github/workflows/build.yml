name: Native packages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: bash -n install.sh
      - name: Build and check native package
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: python scripts/build.py --arch "$EXPECTED_ARCH"
      - run: python scripts/verify_bundle.py dist/devcache/devcache
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error
          retention-days: 7
